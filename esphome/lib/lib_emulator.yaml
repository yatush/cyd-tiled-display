esphome:
  includes:
    - utils.h
    - tiles.h
    - screens.h
    - view.h

packages:
  common: !include lib_common.yaml

time:
  - platform: host
    id: esptime
    timezone: Etc/UTC

number:
  - platform: template
    id: radar_timeout
    name: Radar Timeout
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
  - platform: template
    id: radar_max_move_distance
    name: Radar Max Move Distance
    optimistic: true
    min_value: 0
    max_value: 800
    step: 10
  - platform: template
    id: radar_max_still_distance
    name: Radar Max Still Distance
    optimistic: true
    min_value: 0
    max_value: 800
    step: 10
  - platform: template
    id: light_threshold
    name: light threshold
    optimistic: true
    min_value: 0
    max_value: 255
    step: 1
  
script:
  - id: _init_radar
    then: []
  - id: _adapt_bright
    then: []
  - id: action_toggle_ble_proxy
    then:
      - switch.toggle: ble_proxy_switch
      - lambda: |-
          id(disp).update();
  - id: tile_ble_proxy
    parameters:
      x_start: int
      x_end: int
      y_start: int
      y_end: int
    then:
      - lambda: |-
          int x_mid = (x_start + x_end) / 2;
          int y_mid = (y_start + y_end) / 2;
          bool is_on = id(ble_proxy_switch).state;

          if (!is_on) {
            std::string icon = "\U0000e1a9";
            print(x_mid, y_mid, id(medium), id(dark_dark_gray), TextAlign::CENTER, icon.c_str());
            auto ts = measure(id(text_bold), "OFF");
            filled_rectangle(x_mid - ts.first / 2 - 3, y_mid - ts.second / 2 - 1, ts.first + 6, ts.second + 2, Color::BLACK);
            print(x_mid, y_mid, id(text_bold), id(gray), TextAlign::CENTER, "OFF");
          } else {
            int conns = id(ble_connected_count);
            int rate = id(ble_adv_rate);

            if (conns > 0) {
              std::string icon = "\U0000e1a8";
              char buf[32];
              snprintf(buf, sizeof(buf), "%d conn", conns);
              print(x_mid, y_mid, id(medium), id(light_blue), TextAlign::CENTER, icon.c_str());
              auto ts = measure(id(text_bold), buf);
              filled_rectangle(x_mid - ts.first / 2 - 3, y_mid - ts.second / 2 - 1, ts.first + 6, ts.second + 2, Color::BLACK);
              print(x_mid, y_mid, id(text_bold), id(light_blue), TextAlign::CENTER, buf);
            } else if (rate > 0) {
              std::string icon = "\U0000e1a8";
              char buf[32];
              snprintf(buf, sizeof(buf), "%d/m", rate);
              print(x_mid, y_mid, id(medium), id(light_blue), TextAlign::CENTER, icon.c_str());
              auto ts = measure(id(text_bold), buf);
              filled_rectangle(x_mid - ts.first / 2 - 3, y_mid - ts.second / 2 - 1, ts.first + 6, ts.second + 2, Color::BLACK);
              print(x_mid, y_mid, id(text_bold), id(light_blue), TextAlign::CENTER, buf);
            } else {
              std::string icon = "\U0000e1a8";
              print(x_mid, y_mid, id(medium), id(light_blue), TextAlign::CENTER, icon.c_str());
              auto ts = measure(id(text_bold), "ON");
              filled_rectangle(x_mid - ts.first / 2 - 3, y_mid - ts.second / 2 - 1, ts.first + 6, ts.second + 2, Color::BLACK);
              print(x_mid, y_mid, id(text_bold), id(light_blue), TextAlign::CENTER, "ON");
            }
          }

globals:
  - id: ble_adv_rate
    type: int
    initial_value: "0"
  - id: ble_connected_count
    type: int
    initial_value: "0"

switch:
  - platform: template
    name: "BLE Proxy Switch (Simulated)"
    id: ble_proxy_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

output:
  - platform: template
    id: backlight_pwm
    type: float
    write_action: []
  - platform: template
    id: led_red
    type: float
    write_action: []
  - platform: template
    id: led_green
    type: float
    write_action: []
  - platform: template
    id: led_blue
    type: float
    write_action: []

light:
  - platform: rgb
    name: LED
    id: led
    red: led_red
    green: led_green
    blue: led_blue

button:
  - platform: template
    name: "Restart Emulator"
    id: restart_button
    on_press:
      then:
        - logger.log: "Restart button pressed (simulated)"

binary_sensor:
  - platform: template
    name: Radar Target
    id: radar_has_target
  - platform: template
    name: Radar Moving Target
    id: radar_has_moving_target
    on_state:
      then:
        - script.execute: _on_movement
  - platform: template
    name: Radar Still Target

sensor:
  - platform: template
    name: "WiFi Signal Percent"
    id: wifi_signal_pct
    lambda: return 100.0;
    update_interval: 60s

  - platform: template
    id: board_ldr_p
    name: "Ambient Light"
    lambda: return 50.0;

  - platform: template
    name: Radar Moving Distance
    id: moving_distance
    lambda: return 0.0;
  - platform: template
    name: Radar Still Distance
    id: still_distance
    lambda: return 0.0;
  - platform: template
    name: Radar Detection Distance
    id: radar_detection_distance
    lambda: return 0.0;
  - platform: template
    name: Radar Light
    id: radar_light
    lambda: return 0.0;
