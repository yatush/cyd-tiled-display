# tuya_ble_fan.yaml — Low-RAM BLE configuration for direct Tuya FlyFan control
# Automatically included in packages when any fan/light entity is configured for BLE control.

substitutions:
  # Compact display buffer on 3.5" panels so Wi-Fi + HA API + BLE all have safe heap headroom
  display_buffer_size: "20%"
  # 1 shared GATT slot for tuya_ble_fan (bumped automatically for multi-fan / ble_proxy)
  ble_max_connections: "1"

esp32:
  partitions: lib/partitions_4mb_ota.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      # Tuya BLE is GATT-client only; limit connection slots to minimize SRAM
      CONFIG_BT_GATTS_ENABLE: n
      CONFIG_BTDM_CTRL_BLE_MAX_CONN: "${ble_max_connections}"
      CONFIG_BT_ACL_CONNECTIONS: "${ble_max_connections}"

api:
  custom_services: true
  homeassistant_services: true

esp32_ble:
  max_connections: ${ble_max_connections}

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    interval: 320ms
    window: 160ms
    active: true
    continuous: false
